[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "forever-ah-mcp"
version = "0.1.0"
description = "Samlar WoW Forever-auktionsdata från Battle.net-API:t och exponerar den som MCP-server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp[cli]>=1.12,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forever-ah-collector = "forever_ah.collector:main"
forever-ah-mcp = "forever_ah.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forever_ah"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
